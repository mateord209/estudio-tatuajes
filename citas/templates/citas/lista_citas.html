<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas - Estudio de Tatuajes</title>
</head>
<body>
    <h1>Citas</h1>
    <a href="{% url 'crear_cita' %}">+ Nueva cita</a>

    <table border="1" cellpadding="8" style="margin-top: 20px; border-collapse: collapse;">
        <tr>
            <th>Cliente</th>
            <th>Tatuador</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        {% for cita in citas %}
        <tr>
            <td>{{ cita.nombre_cliente }}</td>
            <td>{{ cita.nombre_tatuador }}</td>
            <td>{{ cita.fecha }}</td>
            <td>{{ cita.hora }}</td>
            <td>{{ cita.get_estado_display }}</td>
            <td>
                <a href="{% url 'editar_cita' cita.pk %}">Editar</a> |
                <a href="{% url 'eliminar_cita' cita.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No hay citas registradas.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
