<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Estudio de Tatuajes</title>
</head>
<body>
    <h1>Clientes</h1>
    <a href="{% url 'crear_cliente' %}">+ Nuevo cliente</a>

    <table border="1" cellpadding="8" style="margin-top: 20px; border-collapse: collapse;">
        <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Registrado</th>
            <th>Acciones</th>
        </tr>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.fecha_registro }}</td>
            <td>
                <a href="{% url 'editar_cliente' cliente.pk %}">Editar</a> |
                <a href="{% url 'eliminar_cliente' cliente.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No hay clientes registrados.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
