<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar cliente - Estudio de Tatuajes</title>
</head>
<body>
    <h1>¿Eliminar este cliente?</h1>

    <p>
        <strong>Nombre:</strong> {{ cliente.nombre }}<br>
        <strong>Teléfono:</strong> {{ cliente.telefono }}<br>
        <strong>Email:</strong> {{ cliente.email }}
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <p><a href="{% url 'lista_clientes' %}">Cancelar</a></p>
</body>
</html>
